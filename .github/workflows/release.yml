name: release

on:
  push:
    tags:
      - '[0-9]*.[0-9]*.[0-9]*'
      - 'v[0-9]*.[0-9]*.[0-9]*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate tag (x.y.z)
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag must be x.y.z (got $TAG)"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build sound catalog (best effort)
        run: npm run build:catalog || echo "catalog fetch failed; app falls back to offline mocks"

      - name: Build for Pages (relative base)
        run: npm run build:pages

      - name: Zip dist
        run: cd dist && zip -r ../dist.zip . && cd ..

      - name: Generate release notes
        uses: orhun/git-cliff-action@v4
        with:
          args: --latest -o release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          files: dist.zip
          fail_on_unmatched_files: true
          generate_release_notes: false
